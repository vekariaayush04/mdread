[package]
name = "mdread"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal Markdown reader with a navigable docs tree"
license = "MIT"
repository = "https://github.com/vekariaayush04/mdread"
readme = "README.md"
keywords = ["markdown", "tui", "terminal", "viewer", "cli"]
categories = ["command-line-utilities", "text-processing"]

[lib]
name = "mdread"
path = "src/lib.rs"

[[bin]]
name = "mdread"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
comrak = "0.54"
syntect = { version = "5.3", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
anyhow = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.48"

[profile.release]
lto = true
codegen-units = 1
strip = true
