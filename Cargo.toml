[package]
name = "mdread"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
# Describes what it does TODAY. The docs-tree browser is planned, not built,
# and a crates.io description is a promise to people who have not run it yet.
description = "A terminal Markdown reader with search, syntax-highlighted code, GFM tables, and themes"
license = "MIT"
repository = "https://github.com/vekariaayush04/mdread"
homepage = "https://github.com/vekariaayush04/mdread"
readme = "README.md"
keywords = ["markdown", "tui", "terminal", "viewer", "cli"]
categories = ["command-line-utilities", "text-processing"]
# Planning documents are for the repo, not for everyone who downloads the crate.
exclude = ["docs/superpowers/", "BUILD_REPORT.md", ".github/", "assets/"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "mdread"
path = "src/lib.rs"

[[bin]]
name = "mdread"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
# default-features = false is load-bearing here. comrak's defaults are
# ["cli", "syntect-onig", "bon"], which pull in oniguruma (a C library that
# breaks cross-compilation) plus comrak's entire CLI dependency tree. Cargo
# unifies features across the whole graph, so comrak's syntect settings would
# win over ours below no matter what we write there. We only parse with comrak.
comrak = { version = "0.54", default-features = false }
syntect = { version = "5.3", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6"
anyhow = "1"
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
insta = "1.48"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
